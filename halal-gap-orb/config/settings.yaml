# All tunable parameters. Code must never hardcode these.

universe:
  min_price: 10.0
  min_dollar_volume_20d: 10_000_000
  min_atr_pct: 0.01            # 1% of price
  atr_window: 14
  use_sp500_constituents: true

scanner:
  min_gap_pct_large_cap: 0.02
  min_gap_pct_default: 0.02
  large_cap_dollar_volume_threshold: 100_000_000
  min_premarket_dollar_volume: 5_000_000
  min_premarket_rvol: 2.0
  premarket_rvol_lookback_days: 20
  premarket_session_start: "04:00"
  premarket_session_end: "09:30"

strategy:
  rvol_5min_min: 1.5
  max_candidates_per_day: 10
  candidate_top_n: 5            # take top N by rvol_5min
  stop_atr_multiplier: 0.10
  stop_min_pct: 0.005
  long_only: true
  exit_mode: "mode_b_2r_trail"  # "mode_a_eod" | "mode_b_2r_trail"
  eod_exit_time: "15:55"
  trail_ema_period: 9
  partial_take_r: 4.0
  partial_take_fraction: 0.33

risk:
  nav: 100_000.0
  risk_per_trade: 0.005          # 0.5% NAV
  max_leverage: 4.0
  max_concurrent_positions: 5

execution:
  commission_per_share: 0.0
  entry_slippage_per_share: 0.01
  exit_slippage_per_share: 0.005

backtest:
  start_date: "2022-01-03"
  end_date: "2023-12-29"
  out_of_sample_months: 6
  benchmark: "SPY"

llm:
  model: "gpt-4o-mini"
  max_daily_spend_usd: 5.0
  news_lookback_hours: 18
  min_strength: 3

ml:
  win_probability_threshold: 0.55
  xgb:
    max_depth: 4
    learning_rate: 0.05
    n_estimators: 500
    early_stopping_rounds: 50
  cv:
    train_months: 12
    test_months: 3
    step_months: 3

kill_switch:
  consec_losing_days: 3
  rolling_dd_pct: 0.15
  rolling_dd_window_days: 30
  paper_live_sharpe_divergence: 1.0
  vix_threshold: 30.0
  vix_consec_closes: 3
  position_correlation_max: 0.7

fmp:
  base_url: "https://financialmodelingprep.com/api/v3"
  stable_base_url: "https://financialmodelingprep.com/stable"
  rate_limit_concurrency: 20
  retry_attempts: 3
  retry_backoff_seconds: 2.0

paths:
  cache_dir: "data/cache"
  paper_trades: "data/paper_trades.parquet"
  reports_dir: "reports"
  models_dir: "models"

timezone: "America/New_York"
